name: "Chromatic"

on:
  push:
  # Runs in the upstream repo for PRs opened from forks
  pull_request:

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - name: Install dependencies
        # ⚠️ See your package manager's documentation for the correct command to install dependencies in a CI environment.
        run: npm install
      - name: Run Chromatic
        # Flag equivalents of the former chromaui/action inputs:
        # onlyChanged -> --only-changed, exitZeroOnChanges -> --exit-zero-on-changes,
        # externals -> --externals (one flag per glob).
        # exitZeroOnChanges defaults to true in the action but false in the CLI, so it's set explicitly.
        run: >-
          npm run chromatic --
          --only-changed
          --exit-zero-on-changes
          --externals "**/*.sass"
          --externals "**/*.css"
          --externals "public/**"
